[project]
name = "drift"
version = "0.0.0"
description = "A study of conversational manipulation in language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }  # pending Unit 8.3 release decision
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Apple Silicon local target serving. Mac-only; the CUDA cloud path uses a
# separate `cloud` extra (added when the cloud target adapter lands).
local = [
    "mlx-lm>=0.31,<1.0",  # make_sampler/generate kwargs have churned; pin a range
]
# API target adapters (eval-time). Per-provider so you install only what you use.
anthropic = [
    "anthropic>=0.40,<1.0",
]
openai = [
    "openai>=2.0,<3.0",
]
google = [
    "google-genai>=2.0,<3.0",
]
api = [
    "drift[anthropic,openai,google]",  # convenience: all three providers
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
